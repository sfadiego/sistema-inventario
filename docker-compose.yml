services:
  php:
    build:
      context: .
    env_file: .env
    container_name: laravel_php
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/var/www/html
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
      - /var/www/html/vendor
      - ./scripts:/scripts:ro
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/app/private:/var/www/html/storage/app/private
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - '8000:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel

  node:
    image: node:22-alpine
    container_name: laravel_node
    env_file: .env
    environment:
      # evita preguntas interactivas de pnpm (el contenedor no tiene terminal)
      CI: 'true'
    working_dir: /app
    volumes:
      - .:/app
      # node_modules propio del contenedor (binarios linux): no toca el node_modules del host
      - node_modules:/app/node_modules
      - /app/.pnpm-store
    # usa la versión de pnpm fijada en package.json ("packageManager")
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
volumes:
  mysql_data:
  node_modules:
